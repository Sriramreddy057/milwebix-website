<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b16">
  <title>Thank You | Milwebix Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <main class="thankyou-page">
    <div class="thankyou-card">
      <a class="brand" href="/" aria-label="Milwebix home" style="justify-content:center;margin-bottom:34px">
        <img src="milwebix-logo-navy.png" alt="Milwebix Solutions">
      </a>
      <div class="success-ring" aria-hidden="true">✓</div>
      <div class="eyebrow" style="justify-content:center"><span class="pulse-dot"></span> MESSAGE RECEIVED</div>
      <h1>Thanks for reaching out.</h1>
      <p>Your inquiry is safely on its way to the Milwebix team. We appreciate you considering us for your next project.</p>
      <div class="thankyou-divider"></div>
      <p class="thankyou-next">What happens next? We'll review your message and get back to you as soon as we can.</p>
      <div class="thankyou-actions">
        <a class="button button-primary" href="/">Back to Milwebix <span>↗</span></a>
        <a class="thankyou-home" href="/#services">Explore our services <span>↓</span></a>
      </div>
    </div>
  </main>
</body>
</html>
